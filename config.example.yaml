caldav:
  url: http://caldav.test:5232
  # Required in single-user mode; omit these in caldav-login mode.
  username: dayfront
  password: change-me
  timeoutMs: 10000

authentication:
  # single-user preserves the original shared account. caldav-login prompts
  # each user and verifies the supplied credentials against the server above.
  mode: single-user
  # Required only for caldav-login. Use a unique secret of at least 32
  # characters, keep it stable across restarts, and never commit it.
  # sessionSecret: replace-with-a-long-random-deployment-secret
  # Alternatively, use a writable persistent path and DayFront will generate it:
  # sessionSecretFile: /data/session-secret
  sessionTtlHours: 720

server:
  host: 0.0.0.0
  port: 8080
  trustProxy: false

ui:
  defaultView: month
  darkMode: auto
  sidebar:
    # enabled removes or includes the sidebar feature; defaultOpen controls its
    # initial collapsed state when enabled.
    enabled: true
    defaultOpen: true
    showBrand: true
    showTasks: true
    showCalendars: true

calendar:
  # Browser-local display, UTC, or an IANA name such as Europe/Berlin.
  timezone: local
  weekStartsOn: locale
  maxOccurrences: 5000

# Optional display-only external iCalendar feeds. Invalid entries are logged
# and ignored without preventing DayFront from starting.
calendar_subscriptions:
  # - id: quebec-holidays
  #   name: Quebec Holidays
  #   url: https://example.com/quebec-holidays.ics
  #   enabled: true
  #   color: "#3b82f6"
  #   refresh_interval: 24h

logging:
  level: info
  format: pretty
